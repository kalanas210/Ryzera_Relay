[project]
name = "relay-engine"
version = "0.1.0"
description = "Relay's planning engine: operating rules, the trip-time standard, clocks, the proposal and deferrals"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_engine"]
