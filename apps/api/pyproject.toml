[project]
name = "relay-api"
version = "0.1.0"
description = "Relay's API: orders, plans, loads, runs, receipts, live updates and the demo clock"
requires-python = ">=3.11"
dependencies = [
  "relay-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "python-multipart>=0.0.18",
]

[project.scripts]
relay-api = "relay_api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_api"]

[tool.uv.sources]
relay-engine = { workspace = true }
