#cloud-config
# Docker from Docker's own repository, a swap file for the image builds, and security updates on their own.
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - unattended-upgrades

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - systemctl enable --now docker
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo "/swapfile none swap sw 0 0" >> /etc/fstab
  - mkdir -p /opt/relay /opt/relay-backups && chown ubuntu:ubuntu /opt/relay /opt/relay-backups
  - touch /var/lib/cloud/instance/relay-ready
