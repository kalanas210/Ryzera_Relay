# Relay: `docker compose up` starts the database, applies migrations, seeds the shared network and
# the story day, then serves the app on http://localhost:8080. Settings come from .env if present
# (see .env.example); every one has a working default.
name: relay

x-api-env: &api-env
  RELAY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay}@db:5432/${POSTGRES_DB:-relay}
  RELAY_SECRET_KEY: ${RELAY_SECRET_KEY:-local-only-secret-change-me-before-deploying}
  RELAY_DEMO_MODE: ${RELAY_DEMO_MODE:-true}
  RELAY_SEED_PASSWORD: ${RELAY_SEED_PASSWORD:-relay2026}
  RELAY_COOKIE_SECURE: ${RELAY_COOKIE_SECURE:-false}

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay}
      POSTGRES_DB: ${POSTGRES_DB:-relay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot: apply migrations, then seed whatever is missing. Safe to run on every start.
  migrate:
    image: relay-api
    build: *api-build
    command: ["relay-api", "setup"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: relay-api
    build: *api-build
    command: ["relay-api", "serve", "--port", "8000"]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: relay-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${RELAY_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
