name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Engine and API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # the API tests create, migrate, seed and drop their own database on this server
      RELAY_TEST_ADMIN_URL: postgresql://relay:relay@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check apps packages
      - name: Types
        run: uv run mypy apps/api/src packages/engine/src
      - name: Tests
        run: uv run pytest

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @relay/web lint
      - name: Tests
        run: pnpm --filter @relay/web test
      - name: Type check and build
        run: pnpm --filter @relay/web build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every service the way docker compose up does
        run: docker compose build

  e2e:
    name: Judge walkthrough in a browser
    runs-on: ubuntu-latest
    # The image build, the installs and the engine warm-up take about 5 minutes and the suite about 3. Playwright
    # stops the run at 8 minutes (globalTimeout in e2e/playwright.config.ts), so even a hung API leaves time to
    # upload the report and the logs.
    timeout-minutes: 15
    env:
      RELAY_PORT: "8080"
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack the way a judge does
        run: docker compose up -d --build --wait --wait-timeout 240
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @relay/e2e
      - name: Lint and type check the suite
        run: |
          pnpm --filter @relay/e2e lint
          pnpm --filter @relay/e2e typecheck
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @relay/e2e exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: pnpm --filter @relay/e2e exec playwright install-deps chromium
      - name: Wait for the engine cache warm-up
        # relay-api serve answers health checks at once and warms the engine cache in a separate process, about a
        # minute on a fresh database. Tests that start before it ends race it for the first plan proposals. A slow
        # warm-up only makes the suite slower, so it warns rather than fails.
        run: |
          if timeout 180 sh -c 'until docker compose logs api | grep -qE "Engine cache warm for the story day|Warming the engine cache failed"; do sleep 5; done'; then
            docker compose logs --no-log-prefix api | grep -E "Engine cache warm for the story day|Warming the engine cache failed"
          else
            echo "::warning::The engine cache was not warm after 3 minutes; the first plan proposals will be slower."
          fi
      - name: Run the walkthrough and the other browser tests
        timeout-minutes: 9
        run: pnpm e2e
      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
      - name: Show the stack's logs
        if: failure() || cancelled()
        run: docker compose logs --no-color --tail 300
      - name: Stop the stack and drop its database
        if: always()
        run: docker compose down -v
