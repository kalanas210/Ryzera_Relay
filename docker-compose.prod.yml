# Production overlay for the public server, see infra/README.md.
# Caddy keeps its certificates in a volume, so a redeploy does not ask Let's Encrypt again.
services:
  web:
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
